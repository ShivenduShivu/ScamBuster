AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ScamBuster static web hosting — keeps site objects private behind a
  CloudFront origin access control

Metadata:
  'com.aws.cloudformation.Context':
    arch: browser -> CloudFront -> private S3
    must:
      - site bucket remains private
      - CloudFront is the only object reader
      - viewer HTTP redirects to HTTPS
    ref:
      - at: ../README.md
        has: system architecture and live endpoint
        scope: repository

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      'com.aws.cloudformation.Context':
        why: stores small immutable static assets; private REST origin supports OAC unlike S3 website hosting
        must:
          - block all public access
          - permit reads only through the paired distribution
        mutable: change-with-constraints
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      'com.aws.cloudformation.Context':
        why: signs CloudFront origin requests with SigV4 so S3 objects need no public policy
        must:
          - use always signing behavior
        mutable: must-never-change
    Properties:
      OriginAccessControlConfig:
        Description: Access ScamBuster site assets in the private S3 bucket
        Name: !Sub ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      'com.aws.cloudformation.Context':
        why: serves the mobile web app globally over HTTPS with compressed cached assets and security headers
        must:
          - origin stays attached to SiteOriginAccessControl
          - 403 and 404 resolve to index.html for direct application loads
        mutable: change-with-constraints
    Properties:
      DistributionConfig:
        Comment: ScamBuster static web application
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: SiteBucketOrigin
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_100
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      'com.aws.cloudformation.Context':
        why: grants one distribution read access and rejects every non-TLS S3 request
        must:
          - scope CloudFront allow by both distribution ARN and account
          - preserve explicit insecure-transport deny
        mutable: review-required
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub ${SiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  CloudFrontUrl:
    Description: Public HTTPS URL for the ScamBuster web application.
    Value: !Sub https://${SiteDistribution.DomainName}
  SiteBucketName:
    Description: Private S3 bucket containing frontend assets.
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution identifier used for cache invalidations.
    Value: !Ref SiteDistribution
